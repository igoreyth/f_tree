<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Семейное древо</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--fill:rgba(118,118,128,.12);--accent:#0071e3;--red:#e0312b;--shadow:0 2px 6px rgba(0,0,0,.05),0 22px 60px rgba(0,0,0,.1)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--ink2:#a1a1a6;--fill:rgba(118,118,128,.24);--accent:#2997ff;--red:#ff6961;--shadow:0 2px 6px rgba(0,0,0,.4),0 22px 60px rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:20px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:380px;background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:34px 28px 28px;text-align:center}
.lock{width:56px;height:56px;margin:0 auto 16px;border-radius:16px;background:var(--fill);display:grid;place-items:center}
.lock svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:0 0 6px;font-weight:600}
p{margin:0 0 20px;color:var(--ink2);font-size:15px}
input[type=password],input[type=text]{width:100%;border:0;background:var(--fill);border-radius:12px;padding:13px 14px;font:inherit;color:inherit;text-align:center}
input:focus-visible,button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 2px 18px;font-size:14px;color:var(--ink2)}
.row label{display:flex;align-items:center;gap:8px;cursor:pointer}
.row button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0}
.go{width:100%;border:0;border-radius:980px;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:13px;cursor:pointer}
.go:disabled{opacity:.5;cursor:default}
.err{min-height:22px;margin:12px 0 0;color:var(--red);font-size:14px}
</style>
</head>
<body>

  <h1>Семейное древо</h1>
  <p>Страница закрыта. Введите кодовую фразу, которую вам передали.</p>

  <div class="row"><label><input id="r" type="checkbox" checked> Запомнить на этом устройстве</label><button type="button" id="s">Показать</button></div>
  <button class="go" id="b">Открыть</button>
  <div class="err" id="e" role="alert"></div>
</form>
